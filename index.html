<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A8201A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23a8201a'/%3E%3C/svg%3E">
<title>TERROR ISLAND 恐怖島｜台南事件地圖</title>
<meta name="description" content="19 個六邊形拼成一座府城：整理台南真實新聞的互動地圖，每則事件附原始新聞來源。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/hud.css">
<link rel="stylesheet" href="./css/panels.css">
<link rel="stylesheet" href="./css/mobile.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body class="side-open">
<main id="app" data-src="./data/tainan.json">
<div id="stage" data-label="六邊形組成的台南事件地圖；完整文字內容請使用清單"></div>

<header class="brand"><a class="logo" href="./" aria-label="重新載入">TERROR <span>ISLAND.</span></a><div class="brand-r"><h1 id="brand-title">台南恐怖島</h1><p class="sub"><em>FEAR</em>事件地圖</p></div></header>

<div class="hero-note"><div class="number" id="hero-number">19</div><h2>一格一座島<br>一島一串真實新聞</h2><p id="hero-period"></p></div>

<nav class="toolbar" aria-label="地圖操作">
<button id="tour-start" title="播放導覽"><svg class="tb-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z"/></svg> 導覽</button>
<button id="home" data-action="home" title="回到全景"><svg class="tb-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg> 全景</button>
<button id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar">☰ 清單</button>
<button id="about-open" data-action="about" title="關於本站">關於</button>
<button id="help" class="square" aria-label="操作說明">?</button>
</nav>

<aside id="sidebar" class="sidebar" aria-label="島嶼與事件清單">
<button id="sheet-handle" class="sheet-handle mob-only" aria-label="展開或收合清單"><i></i></button>
<div class="side-head">
<div class="eyebrow">THE EVENT INDEX</div>
<h2>這座城，發生過什麼。</h2>
<p id="side-count"></p>
<div class="side-actions mob-only"><button data-action="home">重設地圖</button><button data-action="about">關於本站</button></div>
<input id="search" class="search" type="search" aria-label="搜尋島嶼或事件" placeholder="搜尋島嶼、事件、關鍵字…">
</div>
<div id="tree" class="tree"></div>
<p class="disclaimer" id="disclaimer"></p>
</aside>

<article id="card" class="card" hidden aria-label="選取項目詳細資料">
<button class="close" id="card-close" aria-label="關閉詳細資料">×</button>
<div id="card-content"></div>
</article>

<div class="hud" aria-label="顯示選項">
<div class="seg" role="group" aria-label="時段">
<button data-time="360" title="清晨" aria-label="清晨 06:00"><svg viewBox="0 0 24 24"><path d="M4 17h16M7 17a5 5 0 0110 0M12 6v3M5.5 9.5l2 2M18.5 9.5l-2 2"/></svg></button>
<button data-time="720" title="白天" aria-label="白天 12:00"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
<button data-time="1080" title="逢魔時刻" aria-label="逢魔時刻 18:00"><svg viewBox="0 0 24 24"><path d="M3 18h18M6 18a6 6 0 0112 0M4 14h2M18 14h2M12 7v2"/><path d="M9 21h6"/></svg></button>
<button data-time="1260" title="深夜" aria-label="深夜 21:00"><svg viewBox="0 0 24 24"><path d="M19 15A8 8 0 019 5a7 7 0 1010 10z"/></svg></button>
</div>
<div class="seg" role="group" aria-label="顯示圖層">
<button data-toggle="names" aria-pressed="true" title="島嶼名牌"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/></svg><span>名牌</span></button>
<button data-toggle="frozen" aria-pressed="false" title="暫停動畫"><svg viewBox="0 0 24 24"><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></svg><span>暫停</span></button>
<button data-toggle="bird" aria-pressed="false" title="鳥瞰"><svg viewBox="0 0 24 24"><path d="M3 12l9-7 9 7-9 7z"/><path d="M3 12v3l9 7 9-7v-3"/></svg><span>鳥瞰</span></button>
<button data-toggle="overview" aria-pressed="false" title="總覽"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg><span>總覽</span></button>
</div>
</div>

<aside class="overview" id="overview" hidden aria-label="總覽">
<div class="ov-head"><div><div class="eyebrow">OVERVIEW</div><h3>總覽</h3><p class="ov-sub" id="ov-sub"></p></div><button id="overview-close" aria-label="關閉總覽">×</button></div>
<div id="overview-body"></div>
</aside>

<div class="mascot"><span class="face" aria-hidden="true"><svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="15" fill="#cfdcf2"/><path d="M7.5 12.2l5.2-2.4M24.5 12.2l-5.2-2.4" stroke="#1b1517" stroke-width="1.7" stroke-linecap="round" fill="none"/><ellipse cx="11.2" cy="15.6" rx="1.7" ry="2.2" fill="#1b1517"/><ellipse cx="20.8" cy="15.6" rx="1.7" ry="2.2" fill="#1b1517"/><path d="M10.8 24.2q5.2-4.6 10.4 0q-5.2-1.6-10.4 0z" fill="#1b1517"/></svg></span><span id="mascot-text"></span></div>

<section class="controls" aria-label="事件時間軸與篩選">
<div class="control-tabs" role="tablist">
<button class="active" role="tab" aria-selected="true" data-panel="tl">01 事件時間軸</button>
<button role="tab" aria-selected="false" data-panel="isle">02 依島篩選</button>
<button role="tab" aria-selected="false" data-panel="fear">03 事件類型</button>
<div class="status" id="status"></div>
</div>
<div class="panel active" id="panel-tl" role="tabpanel">
<div class="tl-row"><button id="tl-play" class="play" aria-label="播放時間軸">▶</button><output id="tl-month">全部</output><button id="tl-all" class="tl-chip" aria-pressed="true">全部</button><button id="tl-cum" class="tl-chip" aria-pressed="false">累積</button></div>
<div class="tl-track"><div class="tl-dots" id="tl-dots" aria-hidden="true"></div><input id="tl" type="range" min="0" max="0" value="0" aria-label="事件時間軸，月份"></div>
<div class="ticks" id="tl-ticks"></div>
<div class="tl-list" id="tl-list"></div>
</div>
<div class="panel" id="panel-isle" role="tabpanel"><div class="term-buttons" id="isle-buttons"></div><p class="control-note">選一座島，只顯示那座島。</p></div>
<div class="panel" id="panel-fear" role="tabpanel"><div class="term-buttons" id="fear-buttons"></div><p class="control-note">可複選。依事件類型篩選島嶼，未符合的島嶼會褪色。</p></div>
</section>

<div id="tour-caption" class="tour-caption" aria-live="polite"></div>
<div class="tour-controls"><span id="tour-time">00 / 00</span><button id="tour-pause">暫停</button><button id="tour-replay">重播</button><button id="tour-exit">離開</button></div>

<div class="dialog" id="intro" hidden><div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="intro-title"><div class="eyebrow" id="intro-count"></div><h2 id="intro-title"></h2><p id="intro-body"></p><div class="dialog-actions"><button id="intro-skip">略過</button><button id="intro-next" class="next">下一步 →</button></div></div></div>
<div class="dialog" id="about" hidden><div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="about-title"><div class="eyebrow">ABOUT</div><h2 id="about-title">關於本站</h2><div id="about-body"></div><div class="dialog-actions"><button id="about-close" class="next">關閉</button></div></div></div>
<div id="loading" class="loading" role="status"><h2>TERROR</h2><p id="loading-text">正在載入事件…</p></div>
<noscript><p class="nojs">這個互動地圖需要啟用 JavaScript 與 WebGL。</p></noscript>
</main>
<script type="module" src="./js/main.js"></script>
</body>
</html>
